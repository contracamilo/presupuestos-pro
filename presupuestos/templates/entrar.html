{% extends "base.html" %}
{% from "fragmentos/_mensajes.html" import mensaje %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="entrar">
  <h1>Iniciar sesión</h1>
  {% if aviso %}{{ mensaje('aviso', aviso) }}{% endif %}
  {% if error %}{{ mensaje('error', error) }}{% endif %}
  <form method="post" action="/entrar">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="username" required>
    <label for="contrasena">Contraseña</label>
    <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
    <div class="acciones"><button type="submit" class="boton">Entrar</button></div>
  </form>
</section>
{% endblock %}
